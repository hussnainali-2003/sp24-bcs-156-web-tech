<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 3 | Quantity Stepper</title>
  <link rel="stylesheet" href="styles.css">
  <script src="quantity.js" defer></script>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">LAB 3 · DRILL 1</p>
    <h1>Quantity stepper</h1>
    <p class="intro">Use the buttons to change the quantity. It can never go below 1.</p>
    <div class="stepper" aria-label="Quantity selector">
      <button id="decrease" type="button" aria-label="Decrease quantity">−</button>
      <strong id="quantity">1</strong>
      <button id="increase" type="button" aria-label="Increase quantity">+</button>
    </div>
    <p id="stepper-message" class="result">Current quantity: 1</p>
    <nav><a href="search.html">Next drill: Search</a></nav>
  </main>
</body>
</html>
