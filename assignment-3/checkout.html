<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Tesla Vehicles</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="script.js" defer></script></head>
<body><header><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold letter-spaced" href="index.html">TESLA VEHICLES</a><a class="btn btn-outline-dark rounded-pill" href="cart.html">Back to cart</a></div></nav></header>
<main class="container py-5 checkout-page"><h1 class="fw-bold">Checkout</h1><p class="text-secondary">Enter valid contact and delivery details.</p><form id="checkout-form" novalidate><div class="row g-4"><div class="col-12 col-md-6"><label for="name" class="form-label fw-bold">Full name</label><input id="name" class="form-control" required><small class="error-message"></small></div><div class="col-12 col-md-6"><label for="email" class="form-label fw-bold">Email</label><input id="email" type="email" class="form-control" required><small class="error-message"></small></div><div class="col-12 col-md-6"><label for="phone" class="form-label fw-bold">Phone</label><input id="phone" class="form-control" placeholder="03XX-XXXXXXX" required><small class="error-message"></small></div><div class="col-12 col-md-6"><label for="address" class="form-label fw-bold">Address</label><input id="address" class="form-control" required><small class="error-message"></small></div></div><button class="btn btn-dark w-100 py-3 mt-4" type="submit">Place order</button><p id="success-message" class="success-message"></p></form></main>
<footer class="py-4 border-top"><div class="container"><strong>TESLA VEHICLES</strong></div></footer></body></html>
